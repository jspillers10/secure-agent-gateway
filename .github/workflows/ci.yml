name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project (with dev extras, pinned by pyproject.toml)
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests scripts

      - name: mypy (strict, src only)
        run: mypy src

      - name: Bandit (security static analysis)
        run: bandit -r src -c pyproject.toml

      - name: pip-audit (dependency vulnerability scan)
        run: pip-audit

      - name: pytest
        run: pytest -v --cov=gateway --cov-report=term-missing

  policy-test:
    name: opa test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: "0.70.0"

      - name: opa test
        run: opa test policy/ -v

      - name: opa check (strict Rego v1 compilation)
        run: opa check policy/

  docker-integration:
    name: docker compose integration
    runs-on: ubuntu-latest
    needs: [test, policy-test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install project and Docker evaluation client
        run: pip install -e ".[launcher]"

      - name: Configure non-root Compose identity
        run: |
          echo "HOST_RUNTIME_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_RUNTIME_GID=$(id -g)" >> "$GITHUB_ENV"
          echo "DOCKER_SOCKET_GID=$(stat -c '%g' /var/run/docker.sock)" >> "$GITHUB_ENV"

      - name: Generate ephemeral dev keys (never committed)
        run: python scripts/generate_dev_keys.py

      - name: Build and start the stack
        run: |
          docker compose --profile worker-build build worker-image
          docker compose up -d --build

      - name: Run end-to-end smoke test (host -> gateway)
        run: python scripts/smoke_test.py

      - name: Verify live disposable Worker hardening and cleanup
        run: python scripts/verify_worker_hardening.py

      - name: Run OPA hardening verification (inside internal_net -> opa)
        # internal_net has no egress, so a plain python image can't pip
        # install httpx here; reuse the already-built gateway image,
        # which already has httpx as a project dependency.
        run: |
          docker run --rm --network secure-agent-gateway_internal_net \
            --user "$HOST_RUNTIME_UID:$HOST_RUNTIME_GID" \
            -v "$PWD/scripts:/scripts:ro" \
            -v "$PWD/devkeys:/keys:ro" \
            --entrypoint python \
            secure-agent-gateway-gateway \
            /scripts/verify_opa_hardening.py

      - name: Verify internal mTLS control and negative cases
        run: |
          docker run --rm --network secure-agent-gateway_internal_net \
            --user "$HOST_RUNTIME_UID:$HOST_RUNTIME_GID" \
            -v "$PWD/scripts:/scripts:ro" \
            -v "$PWD/devkeys:/keys:ro" \
            --entrypoint python \
            secure-agent-gateway-gateway \
            /scripts/verify_internal_mtls.py

      - name: Show gateway logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
