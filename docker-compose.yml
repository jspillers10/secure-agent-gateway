# Local research stack. Run scripts/generate_dev_keys.py first. All credentials
# are ephemeral, development-only, and gitignored.
services:
  worker-image:
    profiles: ["worker-build"]
    image: secure-agent-gateway-worker:milestone1
    build:
      context: .
      dockerfile: Dockerfile.worker

  opa:
    image: openpolicyagent/opa@sha256:2b1c4b231f6dfa6a2baea4af4109203b10cd4b65e836d72f03bfe5d8dfce7095 # 0.70.0
    command:
      - run
      - --server
      - --addr=https://0.0.0.0:8181
      - --authentication=tls
      - --authorization=basic
      - --tls-cert-file=/keys/opa-cert.pem
      - --tls-private-key-file=/keys/opa-key.pem
      - --tls-ca-cert-file=/keys/gateway-client-ca-cert.pem
      - /policy
    user: "1000:1000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [internal_net]
    volumes:
      - ./policy:/policy:ro
      - ./devkeys:/keys:ro
    healthcheck:
      test: ["CMD", "/opa", "eval", "-i", "/dev/null", "1"]
      interval: 5s
      timeout: 3s
      retries: 10

  launcher:
    build:
      context: .
      dockerfile: Dockerfile.launcher
    depends_on:
      opa:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [internal_net]
    environment:
      GRANT_PUBLIC_KEY_FILE: /keys/execution-grant-public.pem
      GRANT_ISSUER: secure-agent-gateway
      GRANT_AUDIENCE: secure-agent-worker-launcher
      WORKER_IMAGE_REFERENCE: secure-agent-gateway-worker:milestone1
      WORKER_EXECUTION_TIMEOUT_SECONDS: "5"
      WORKER_OUTPUT_LIMIT_BYTES: "65536"
      WORKER_MEMORY_LIMIT: 128m
      WORKER_NANO_CPUS: "500000000"
      WORKER_PIDS_LIMIT: "64"
    volumes:
      - ./devkeys:/keys:ro
      # High-value prototype trust assumption: this is the only socket mount.
      - /var/run/docker.sock:/var/run/docker.sock

  gateway:
    build: .
    depends_on:
      opa:
        condition: service_healthy
      launcher:
        condition: service_started
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [internal_net, edge_net]
    environment:
      JWT_ISSUER: https://issuer.secure-agent-gateway.local
      JWT_AUDIENCE: secure-agent-gateway
      JWT_PUBLIC_KEY_FILE: /keys/public.pem
      JWT_ALGORITHM: RS256
      OPA_URL: https://opa:8181
      LAUNCHER_URL: https://launcher:8443
      INTERNAL_CA_CERT_FILE: /keys/internal-server-ca-cert.pem
      GATEWAY_CLIENT_CERT_FILE: /keys/gateway-client-cert.pem
      GATEWAY_CLIENT_KEY_FILE: /keys/gateway-client-key.pem
      EXECUTION_GRANT_PRIVATE_KEY_FILE: /keys/execution-grant-private.pem
      EXECUTION_GRANT_PUBLIC_KEY_FILE: /keys/execution-grant-public.pem
      EXECUTION_GRANT_ISSUER: secure-agent-gateway
      EXECUTION_GRANT_AUDIENCE: secure-agent-worker-launcher
      EXECUTION_GRANT_TTL_SECONDS: "30"
      APPROVER_API_KEY: dev-only-approver-key-not-a-secret
      APPROVER_IDENTITY: dev-local-approver
      POLICY_TIMEOUT_SECONDS: "2.0"
      LAUNCHER_TIMEOUT_SECONDS: "10.0"
    volumes:
      - ./devkeys:/keys:ro
    ports:
      - "127.0.0.1:8088:8000"

networks:
  internal_net:
    internal: true
  edge_net: {}
