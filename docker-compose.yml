# Local research stack. Run scripts/generate_dev_keys.py first. All credentials
# are ephemeral, development-only, and gitignored.
services:
  worker-image:
    profiles: ["worker-build"]
    image: secure-agent-gateway-worker:milestone2
    build:
      context: .
      dockerfile: Dockerfile.worker

  opa:
    image: openpolicyagent/opa@sha256:2b1c4b231f6dfa6a2baea4af4109203b10cd4b65e836d72f03bfe5d8dfce7095 # 0.70.0
    command:
      - run
      - --server
      - --addr=https://0.0.0.0:8181
      - --authentication=tls
      - --authorization=basic
      - --tls-cert-file=/keys/opa-cert.pem
      - --tls-private-key-file=/keys/opa-key.pem
      - --tls-ca-cert-file=/keys/gateway-client-ca-cert.pem
      - /policy
    user: "${HOST_RUNTIME_UID:-1000}:${HOST_RUNTIME_GID:-1000}"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [internal_net]
    volumes:
      - ./policy:/policy:ro
      - ./devkeys/opa-cert.pem:/keys/opa-cert.pem:ro
      - ./devkeys/opa-key.pem:/keys/opa-key.pem:ro
      - ./devkeys/gateway-client-ca-cert.pem:/keys/gateway-client-ca-cert.pem:ro
    healthcheck:
      test: ["CMD", "/opa", "eval", "-i", "/dev/null", "1"]
      interval: 5s
      timeout: 3s
      retries: 10

  launcher:
    build:
      context: .
      dockerfile: Dockerfile.launcher
    depends_on:
      opa:
        condition: service_healthy
      egress-broker:
        condition: service_started
    user: "${HOST_RUNTIME_UID:-0}:${HOST_RUNTIME_GID:-0}"
    group_add: ["${DOCKER_SOCKET_GID:-0}"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [internal_net]
    environment:
      GRANT_PUBLIC_KEY_FILE: /keys/execution-grant-public.pem
      GRANT_ISSUER: secure-agent-gateway
      GRANT_AUDIENCE: secure-agent-worker-launcher
      WORKER_IMAGE_REFERENCE: secure-agent-gateway-worker:milestone2
      WORKER_EXECUTION_TIMEOUT_SECONDS: "5"
      WORKER_OUTPUT_LIMIT_BYTES: "524288"
      WORKER_MEMORY_LIMIT: 128m
      WORKER_NANO_CPUS: "500000000"
      WORKER_PIDS_LIMIT: "64"
      EGRESS_SOCKET_VOLUME: secure-agent-gateway_egress_socket
      EGRESS_SOCKET_PATH: /run/secure-agent-egress/broker.sock
      EGRESS_SERVER_HOSTNAME: egress-broker
      EGRESS_SERVER_CA_CERT_FILE: /keys/internal-server-ca-cert.pem
      WORKER_CLIENT_CA_KEY_FILE: /keys/worker-client-ca-private.pem
      WORKER_CLIENT_CA_CERT_FILE: /keys/worker-client-ca-cert.pem
    volumes:
      - ./devkeys/launcher-cert.pem:/keys/launcher-cert.pem:ro
      - ./devkeys/launcher-key.pem:/keys/launcher-key.pem:ro
      - ./devkeys/gateway-client-ca-cert.pem:/keys/gateway-client-ca-cert.pem:ro
      - ./devkeys/execution-grant-public.pem:/keys/execution-grant-public.pem:ro
      - ./devkeys/internal-server-ca-cert.pem:/keys/internal-server-ca-cert.pem:ro
      - ./devkeys/worker-client-ca-cert.pem:/keys/worker-client-ca-cert.pem:ro
      - ./devkeys/worker-client-ca-private.pem:/keys/worker-client-ca-private.pem:ro
      # High-value prototype trust assumption: this is the only socket mount.
      - /var/run/docker.sock:/var/run/docker.sock

  gateway:
    build: .
    depends_on:
      opa:
        condition: service_healthy
      launcher:
        condition: service_started
    user: "${HOST_RUNTIME_UID:-10001}:${HOST_RUNTIME_GID:-10001}"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [internal_net, ingress_net]
    environment:
      JWT_ISSUER: https://issuer.secure-agent-gateway.local
      JWT_AUDIENCE: secure-agent-gateway
      JWT_PUBLIC_KEY_FILE: /keys/public.pem
      JWT_ALGORITHM: RS256
      OPA_URL: https://opa:8181
      LAUNCHER_URL: https://launcher:8443
      INTERNAL_CA_CERT_FILE: /keys/internal-server-ca-cert.pem
      GATEWAY_CLIENT_CERT_FILE: /keys/gateway-client-cert.pem
      GATEWAY_CLIENT_KEY_FILE: /keys/gateway-client-key.pem
      EXECUTION_GRANT_PRIVATE_KEY_FILE: /keys/execution-grant-private.pem
      EXECUTION_GRANT_PUBLIC_KEY_FILE: /keys/execution-grant-public.pem
      EXECUTION_GRANT_ISSUER: secure-agent-gateway
      EXECUTION_GRANT_AUDIENCE: secure-agent-worker-launcher
      EXECUTION_GRANT_TTL_SECONDS: "30"
      APPROVER_API_KEY: dev-only-approver-key-not-a-secret
      APPROVER_IDENTITY: dev-local-approver
      POLICY_TIMEOUT_SECONDS: "2.0"
      LAUNCHER_TIMEOUT_SECONDS: "10.0"
      WEB_FETCH_ALLOWED_ORIGINS: https://fixture.secure-agent.test,https://redirect.secure-agent.test,https://rebinding.secure-agent.test
      WEB_FETCH_MAX_REDIRECTS: "3"
      WEB_FETCH_MAX_RESPONSE_BYTES: "65536"
      WEB_FETCH_TIMEOUT_SECONDS: "5.0"
    volumes:
      - ./devkeys/public.pem:/keys/public.pem:ro
      - ./devkeys/internal-server-ca-cert.pem:/keys/internal-server-ca-cert.pem:ro
      - ./devkeys/gateway-client-cert.pem:/keys/gateway-client-cert.pem:ro
      - ./devkeys/gateway-client-key.pem:/keys/gateway-client-key.pem:ro
      - ./devkeys/execution-grant-private.pem:/keys/execution-grant-private.pem:ro
      - ./devkeys/execution-grant-public.pem:/keys/execution-grant-public.pem:ro

  ingress:
    build:
      context: .
      dockerfile: Dockerfile.ingress
    depends_on:
      gateway:
        condition: service_healthy
    user: "10004:10004"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [ingress_net, edge_net]
    ports:
      - "127.0.0.1:8088:8080"

  egress-broker:
    build:
      context: .
      dockerfile: Dockerfile.egress
    depends_on:
      web-fixture:
        condition: service_started
      protected-fixture:
        condition: service_started
    user: "${HOST_RUNTIME_UID:-10002}:20000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [fixture_net, protected_net]
    environment:
      EGRESS_SOCKET_PATH: /run/secure-agent-egress/broker.sock
      EGRESS_SERVER_CERT_FILE: /keys/egress-broker-cert.pem
      EGRESS_SERVER_KEY_FILE: /keys/egress-broker-key.pem
      WORKER_CLIENT_CA_CERT_FILE: /keys/worker-client-ca-cert.pem
      GRANT_PUBLIC_KEY_FILE: /keys/execution-grant-public.pem
      GRANT_ISSUER: secure-agent-gateway
      GRANT_AUDIENCE: secure-agent-worker-launcher
      EGRESS_ALLOWED_ORIGINS: https://fixture.secure-agent.test,https://redirect.secure-agent.test,https://blocked.secure-agent.test,https://rebinding.secure-agent.test
      EGRESS_DENIED_CIDRS: 11.78.0.0/24
      EGRESS_MAX_REDIRECTS: "3"
      EGRESS_MAX_RESPONSE_BYTES: "65536"
      EGRESS_MAX_TIMEOUT_SECONDS: "5.0"
      EGRESS_UPSTREAM_CA_FILE: /keys/internal-server-ca-cert.pem
    volumes:
      - ./devkeys/egress-broker-cert.pem:/keys/egress-broker-cert.pem:ro
      - ./devkeys/egress-broker-key.pem:/keys/egress-broker-key.pem:ro
      - ./devkeys/worker-client-ca-cert.pem:/keys/worker-client-ca-cert.pem:ro
      - ./devkeys/execution-grant-public.pem:/keys/execution-grant-public.pem:ro
      - ./devkeys/internal-server-ca-cert.pem:/keys/internal-server-ca-cert.pem:ro
      - egress_socket:/run/secure-agent-egress

  web-fixture:
    build:
      context: .
      dockerfile: Dockerfile.web-fixture
    user: "${HOST_RUNTIME_UID:-10003}:${HOST_RUNTIME_GID:-10003}"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      fixture_net:
        ipv4_address: 11.77.0.10
        aliases:
          - fixture.secure-agent.test
          - redirect.secure-agent.test
    volumes:
      - ./devkeys/web-fixture-cert.pem:/keys/web-fixture-cert.pem:ro
      - ./devkeys/web-fixture-key.pem:/keys/web-fixture-key.pem:ro
      - connection_observations:/observations:ro

  protected-fixture:
    build:
      context: .
      dockerfile: Dockerfile.web-fixture
    entrypoint: ["python", "/fixture/protected_connection_fixture.py"]
    user: "${HOST_RUNTIME_UID:-10003}:${HOST_RUNTIME_GID:-10003}"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      protected_net:
        ipv4_address: 11.78.0.11
        aliases:
          - blocked.secure-agent.test
          - rebinding.secure-agent.test
    volumes:
      - ./devkeys/protected-fixture-cert.pem:/keys/protected-fixture-cert.pem:ro
      - ./devkeys/protected-fixture-key.pem:/keys/protected-fixture-key.pem:ro
      - connection_observations:/observations

networks:
  internal_net:
    internal: true
  ingress_net:
    internal: true
  edge_net: {}
  fixture_net:
    internal: true
    ipam:
      config:
        - subnet: 11.77.0.0/24
  protected_net:
    internal: true
    ipam:
      config:
        - subnet: 11.78.0.0/24

volumes:
  egress_socket:
    name: secure-agent-gateway_egress_socket
  connection_observations:
    name: secure-agent-gateway_connection_observations
