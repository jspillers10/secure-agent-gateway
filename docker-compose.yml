# Local, fully offline demo stack. No external services, no real secrets.
#
# Before first run:
#   python scripts/generate_dev_keys.py
#
# This writes an ephemeral RSA keypair to ./devkeys/ (gitignored, never
# committed). The gateway container reads the public half to verify
# delegated-identity tokens; scripts/mint_demo_token.py uses the private
# half to mint tokens for curl testing.
#
# APPROVER_API_KEY and APPROVER_IDENTITY below are fixed, clearly-labeled
# development placeholders standing in for a real approver identity
# system: neither is a production secret, and both grant access only to
# this local compose stack.
#
# Network topology (see docs/architecture.md for the full writeup and why
# it looks like this): `internal_net` carries all gateway<->opa traffic
# and is a Docker `internal: true` network: neither container can reach
# the internet through it, verified in docs/threat-model.md. OPA is
# attached *only* to internal_net: Docker Compose does not support
# publishing a port on a service whose only network is internal (verified
# empirically, not assumed), so making OPA internal-only means it gets no
# host-published port at all: a stronger guarantee than "published but
# loopback-only", at the cost of OPA not being directly reachable from the
# host. The gateway is additionally attached to `edge_net` (a normal,
# non-internal bridge) solely so its own port can be published to the
# host loopback interface for manual curl testing and the smoke test;
# that second network leg does mean the gateway container itself is not
# network-level egress-blocked the way OPA is; see docs/threat-model.md
# for that tradeoff spelled out explicitly.
services:
  opa:
    image: openpolicyagent/opa@sha256:2b1c4b231f6dfa6a2baea4af4109203b10cd4b65e836d72f03bfe5d8dfce7095 # 0.70.0
    command:
      - run
      - --server
      - --addr=:8181
      - --authorization=basic
      - /policy
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal_net
    volumes:
      - ./policy:/policy:ro
    healthcheck:
      test: ["CMD", "/opa", "eval", "-i", "/dev/null", "1"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: .
    depends_on:
      opa:
        condition: service_healthy
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal_net
      - edge_net
    environment:
      JWT_ISSUER: "https://issuer.secure-agent-gateway.local"
      JWT_AUDIENCE: "secure-agent-gateway"
      JWT_PUBLIC_KEY_FILE: "/keys/public.pem"
      JWT_ALGORITHM: "RS256"
      OPA_URL: "http://opa:8181"
      APPROVER_API_KEY: "dev-only-approver-key-not-a-secret"
      APPROVER_IDENTITY: "dev-local-approver"
      POLICY_TIMEOUT_SECONDS: "2.0"
    volumes:
      - ./devkeys:/keys:ro
    ports:
      - "127.0.0.1:8088:8000"

networks:
  internal_net:
    internal: true
  edge_net: {}
