[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "secure-agent-gateway"
version = "0.1.0"
description = "Policy enforcement for AI agent tool calls: an MCP proxy plus a hardened delegated-identity reference gateway."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Jake Spillers" }]
keywords = ["mcp", "model-context-protocol", "ai-agents", "security", "policy", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

# The MCP proxy (`sag`) needs only these. The reference gateway, Launcher,
# and Worker need the [gateway] extra.
dependencies = [
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
]

[project.urls]
Homepage = "https://github.com/jspillers10/secure-agent-gateway"
Documentation = "https://github.com/jspillers10/secure-agent-gateway/blob/main/docs/mcp-proxy.md"
Issues = "https://github.com/jspillers10/secure-agent-gateway/issues"

[project.scripts]
sag = "secure_agent_gateway.cli:main"

[project.optional-dependencies]
gateway = [
    "fastapi==0.141.1",
    "PyJWT==2.15.0",
    "cryptography==50.0.0",
    "httpx==0.28.1",
    "uvicorn[standard]==0.52.4",
]
launcher = [
    "docker==7.1.0",
]
dev = [
    "docker==7.1.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
    "mypy==2.3.1",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "setuptools==84.1.0",
    "types-PyYAML==6.0.12.20260906",
]

[tool.hatch.build.targets.wheel]
packages = ["src/secure_agent_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires docker compose (OPA + gateway) running",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "E501"]
"scripts/*" = ["S105", "S106"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "jwt.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "docker.*"
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = [".venv", "tests"]
